<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corrections FCF</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root {
  --bg: #fbfaf8; --panel: #f2efea; --text: #1f1d1a; --muted: #6b665e; --border: #ddd7cd;
  --accent: #8a2432; --link: #7a1f2b; --code: #efebe4;
  --del-bg: #f9d7d5; --del-fg: #8b1a12; --ins-bg: #d4efd6; --ins-fg: #145a1f;
  --s-faire: #2f6f3e; --s-verif: #a5610b; --s-decision: #6143a0; --s-ajouter: #1d5f8c; --s-deja: #7b7b7b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17161a; --panel: #201f24; --text: #e8e5df; --muted: #9b968d; --border: #35333a;
    --accent: #e06b7a; --link: #f08a97; --code: #26252b;
    --del-bg: #4a2120; --del-fg: #ffb3ab; --ins-bg: #1d3b23; --ins-fg: #a6e3ad;
    --s-faire: #6fcf87; --s-verif: #f0b259; --s-decision: #b79bf0; --s-ajouter: #7cc0ef; --s-deja: #9a9a9a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; height: 100vh; overflow: hidden; }
nav { width: 340px; min-width: 260px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
nav header { padding: 14px 14px 10px; border-bottom: 1px solid var(--border); }
nav h1 { font-size: 16px; margin: 0 0 8px; color: var(--accent); }
nav input, nav select { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; margin-bottom: 6px; }
.quick a { display: inline-block; margin: 2px 6px 2px 0; font-size: 13px; }
#tree { overflow-y: auto; padding: 8px 6px 40px; flex: 1; font-size: 13.5px; }
#tree details { margin-left: 8px; }
#tree summary { cursor: pointer; padding: 2px 4px; color: var(--muted); font-weight: 600; list-style: none; }
#tree summary::before { content: "▸ "; }
#tree details[open] > summary::before { content: "▾ "; }
#tree a { display: flex; gap: 6px; align-items: baseline; padding: 3px 6px 3px 18px; border-radius: 5px; color: var(--text); text-decoration: none; }
#tree a:hover { background: var(--border); }
#tree a.active { background: var(--accent); color: #fff; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; transform: translateY(-1px); }
.count { color: var(--muted); font-weight: 400; }
main { flex: 1; overflow-y: auto; padding: 24px 36px 80px; }
main .doc { max-width: 1400px; }
a { color: var(--link); }
h1 { font-size: 24px; line-height: 1.25; }
h2 { font-size: 19px; margin-top: 28px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
table { border-collapse: collapse; margin: 10px 0; font-size: 14px; }
th, td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; vertical-align: top; }
th { background: var(--panel); }
code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
pre { background: var(--code); padding: 12px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; }
blockquote { border-left: 3px solid var(--border); margin: 8px 0; padding: 2px 12px; color: var(--muted); }
del { background: var(--del-bg); color: var(--del-fg); text-decoration: line-through; }
ins { background: var(--ins-bg); color: var(--ins-fg); text-decoration: none; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; color: #fff; font-size: 12px; font-weight: 600; }
.tabs { display: flex; gap: 6px; margin: 18px 0 10px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
.tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.col { border: 1px solid var(--border); border-radius: 8px; padding: 4px 16px; background: var(--bg); min-width: 0; }
.col h3 { margin: 10px 0; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.col.new h3 { color: var(--s-faire); }
.diff { border: 1px solid var(--border); border-radius: 8px; padding: 10px 18px; white-space: pre-wrap; }
.diff p { margin: 0 0 12px; }
.copy { float: right; font-size: 12px; padding: 3px 9px; margin-top: 8px; border: 1px solid var(--border); border-radius: 5px; background: var(--panel); color: var(--text); cursor: pointer; }
.progress { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
li.task { list-style: none; margin-left: -20px; }
li.task input { margin-right: 6px; transform: scale(1.15); }
li.task.done > a, li.task.done { opacity: .55; }
li.task.ignored > a { text-decoration: line-through; opacity: .55; }
.ign { margin-left: 8px; font-size: 12px; padding: 0 7px; border: 1px solid var(--border); border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; }
li.task.ignored .ign { color: var(--s-decision); border-color: var(--s-decision); }
.bulk { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; }
.bulk button { font-size: 12.5px; padding: 3px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; }
.etat { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); font-size: 14px; margin: 8px 0 4px; }
.etat input[type=text] { flex: 1; min-width: 220px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); color: var(--text); font: inherit; }
#login { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
#login form { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 24px; }
#login h1 { font-size: 18px; color: var(--accent); margin: 0 0 6px; }
#login p { color: var(--muted); margin: 0 0 14px; }
#login input { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; margin-bottom: 10px; }
#login button { width: 100%; padding: 9px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
#loginmsg { margin: 10px 0 0 !important; min-height: 1.2em; }
@media (max-width: 900px) { body { flex-direction: column; height: auto; overflow: visible; } nav { width: 100%; max-height: 45vh; overflow: hidden; } .cols { grid-template-columns: 1fr; } main { padding: 16px; } }
</style>
</head>
<body>
<div id="login">
  <form id="loginform">
    <h1>Corrections FCF – Règles MET</h1>
    <p>Page réservée. Entrez le mot de passe.</p>
    <input id="pw" type="password" autocomplete="current-password" aria-label="Mot de passe" placeholder="Mot de passe">
    <button type="submit">Ouvrir</button>
    <p id="loginmsg" role="status"></p>
  </form>
</div>
<nav>
  <header>
    <h1>Corrections FCF – Règles MET</h1>
    <div class="quick"><a href="#/INDEX.md">Sommaire</a><a href="#/ORDRE DE TRAVAIL.md">Ordre de travail</a><a href="#/NON TRADUIT.md">Non traduit</a></div>
    <input id="q" type="search" placeholder="Rechercher (titre ou texte)…">
    <select id="st"><option value="">Tous les statuts</option></select>
    <div class="progress" id="prog"></div>
    <div class="progress" id="save"></div>
  </header>
  <div id="tree"></div>
</nav>
<main><div class="doc" id="doc"></div></main>
<script>
const COLORS = { "à faire": "var(--s-faire)", "à vérifier": "var(--s-verif)", "décision": "var(--s-decision)", "à ajouter": "var(--s-ajouter)", "déjà corrigé": "var(--s-deja)" };
let F = [], byPath = {}, CFG = {};
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let done = {};
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SPECIAL = ["INDEX.md", "ORDRE DE TRAVAIL.md", "NON TRADUIT.md"];
const sel = document.getElementById("st");

// ---------- enregistrement des cases ----------
// En ligne avec jeton : fichier avancement.json du dépôt GitHub (clés = empreinte du chemin).
// Sinon : stockage du navigateur.
const remote = () => !!(CFG.token && CFG.repo);
const hashes = {};
async function sha(s) { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].slice(0, 12).map(x => x.toString(16).padStart(2, "0")).join(""); }
const b64e = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, "")), c => c.charCodeAt(0)));
const API = () => `https://api.github.com/repos/${CFG.repo}/contents/avancement.json`;
const HDR = () => ({ Authorization: "Bearer " + CFG.token, Accept: "application/vnd.github+json" });
function setState(t, err) { const e = document.getElementById("save"); if (e) { e.textContent = t; e.style.color = err ? "var(--s-verif)" : "var(--muted)"; } }
async function loadRemote() {
  const r = await fetch(API() + "?t=" + Date.now(), { headers: HDR(), cache: "no-store" });
  if (r.status === 404) return { data: {}, sha: null };
  if (!r.ok) throw new Error("lecture " + r.status);
  const j = await r.json();
  return { data: JSON.parse(b64d(j.content) || "{}"), sha: j.sha };
}
// État d'une fiche : absent = à traiter ; { etat: "fait" | "ignore", raison?, date }
const norm = v => !v ? null : v === true || v.fait ? { etat: "fait", date: v.date } : v.etat ? v : null;
const etatOf = p => done[p] ? done[p].etat : null;
function applyRemote(data) { done = {}; for (const f of F) { const v = norm(data[hashes[f.path]]); if (v) done[f.path] = v; } }
async function refresh() {
  if (!remote()) { const s = store.get("fcf-etat", null) || store.get("fcf-done", {}); done = {}; for (const p in s) { const v = norm(s[p]); if (v) done[p] = v; } return; }
  try { const { data } = await loadRemote(); applyRemote(data); setState("Avancement partagé à jour"); }
  catch (e) { setState("Avancement non chargé (" + e.message + ")", true); }
}
// changes : [[chemin, null | "fait" | "ignore", raison?], ...]
async function setEtats(changes) {
  const today = new Date().toISOString().slice(0, 10);
  const val = (e, r) => e ? Object.assign({ etat: e, date: today }, r ? { raison: r } : {}) : null;
  for (const [p, e, r] of changes) { if (e) done[p] = val(e, r); else delete done[p]; }
  buildTree();
  if (!remote()) { store.set("fcf-etat", done); return; }
  setState("Enregistrement…");
  for (let t = 0; t < 4; t++) {
    try {
      const { data, sha: s } = await loadRemote();
      for (const [p, e, r] of changes) { if (e) data[hashes[p]] = val(e, r); else delete data[hashes[p]]; }
      const lab = { fait: "Fait", ignore: "Pas pris en compte" };
      const msg = changes.length === 1 ? (lab[changes[0][1]] || "À traiter") + " : " + hashes[changes[0][0]] : changes.length + " fiches : " + (lab[changes[0][1]] || "à traiter");
      const body = { message: msg, content: b64e(JSON.stringify(data, null, 1) + "\n") };
      if (s) body.sha = s;
      const r = await fetch(API(), { method: "PUT", headers: HDR(), body: JSON.stringify(body) });
      if (r.ok) { applyRemote(data); buildTree(); setState("Enregistré ✓ " + new Date().toLocaleTimeString("fr-FR")); return; }
      if (r.status !== 409 && r.status !== 422) throw new Error("écriture " + r.status);
    } catch (e) { if (t === 3) { setState("Échec de l'enregistrement : " + e.message, true); return; } }
  }
}

// ---------- sidebar ----------
function buildTree() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const s = sel.value;
  const list = F.filter(f => !SPECIAL.includes(f.path) && (!s || f.statut === s) && (!q || f.titre.toLowerCase().includes(q) || f.md.toLowerCase().includes(q)));
  const root = {};
  for (const f of list) { const parts = f.path.split("/"); let n = root; for (const p of parts.slice(0, -1)) n = (n[p] = n[p] || {}); (n.__files = n.__files || []).push(f); }
  const cnt = n => (n.__files || []).length + Object.keys(n).filter(k => k !== "__files").reduce((a, k) => a + cnt(n[k]), 0);
  const open = !!(q || s);
  const render = n => Object.keys(n).filter(k => k !== "__files").sort((a, b) => a.localeCompare(b, "fr")).map(k =>
      `<details${open ? " open" : ""}><summary>${esc(k)} <span class="count">${cnt(n[k])}</span></summary>${render(n[k])}</details>`).join("")
    + (n.__files || []).sort((a, b) => a.path.localeCompare(b.path, "fr")).map(f =>
      `<a href="#/${encodeURI(f.path)}" data-p="${esc(f.path)}" title="${esc(f.statut)}"><span class="dot" style="background:${COLORS[f.statut] || "var(--border)"}"></span><span>${esc(f.titre)}${etatOf(f.path) === "fait" ? " ✓" : etatOf(f.path) === "ignore" ? " ⊘" : ""}</span></a>`).join("");
  document.getElementById("tree").innerHTML = list.length ? render(root) : "<p style='padding:8px;color:var(--muted)'>Aucun résultat.</p>";
  markActive();
  const total = F.filter(f => !SPECIAL.includes(f.path) && !["déjà corrigé"].includes(f.statut)).length;
  const nf = Object.keys(done).filter(p => byPath[p] && etatOf(p) === "fait").length;
  const ni = Object.keys(done).filter(p => byPath[p] && etatOf(p) === "ignore").length;
  document.getElementById("prog").textContent = `${list.length} fiche(s) affichée(s) · ✓ ${nf} faites · ⊘ ${ni} pas prises en compte · ${total - nf - ni} restantes`;
}
// ---------- diff ----------
const stripLinks = s => s.replace(/\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/\*\*|__/g, "");
function lcs(a, b) {
  const n = a.length, m = b.length;
  if (n * m > 4e6) return null;
  const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) { if (a[i] === b[j]) { out.push(["=", a[i]]); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) out.push(["-", a[i++]]); else out.push(["+", b[j++]]); }
  while (i < n) out.push(["-", a[i++]]); while (j < m) out.push(["+", b[j++]]);
  return out;
}
function wordDiff(a, b) {
  const ta = a.split(/(\s+)/), tb = b.split(/(\s+)/);
  const ops = lcs(ta, tb);
  if (!ops) return `<del>${esc(a)}</del> <ins>${esc(b)}</ins>`;
  return ops.map(([o, t]) => o === "=" ? esc(t) : o === "-" ? `<del>${esc(t)}</del>` : `<ins>${esc(t)}</ins>`).join("").replace(/<\/del><del>/g, "").replace(/<\/ins><ins>/g, "");
}
function diffHtml(oldT, newT) {
  const pa = stripLinks(oldT).split(/\n{2,}/), pb = stripLinks(newT).split(/\n{2,}/);
  const ops = lcs(pa, pb) || [["-", pa.join("\n\n")], ["+", pb.join("\n\n")]];
  const out = []; let changed = 0;
  for (let k = 0; k < ops.length; k++) {
    const [o, t] = ops[k];
    if (o === "=") { out.push(`<p>${esc(t)}</p>`); continue; }
    changed++;
    if (o === "-" && ops[k + 1] && ops[k + 1][0] === "+") { out.push(`<p>${wordDiff(t, ops[k + 1][1])}</p>`); k++; }
    else out.push(`<p>${o === "-" ? `<del>${esc(t)}</del>` : `<ins>${esc(t)}</ins>`}</p>`);
  }
  return { html: out.join(""), changed };
}

// ---------- surlignage des différences dans la vue côte à côte ----------
// On compare le texte affiché (pas le Markdown), bloc par bloc puis mot par mot,
// et on entoure les mots changés : rouge barré à gauche, vert à droite.
function textTokens(block) {
  const toks = [], w = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
  for (let n = w.nextNode(); n; n = w.nextNode()) for (const t of n.data.split(/(\s+)/)) if (t) toks.push({ t, n });
  return toks;
}
function wrapTokens(toks, changed, tag) {
  // reconstruit chaque nœud texte en entourant les mots changés
  const byNode = new Map();
  toks.forEach((tk, i) => { if (!byNode.has(tk.n)) byNode.set(tk.n, []); byNode.get(tk.n).push([tk.t, changed[i] && /\S/.test(tk.t)]); });
  for (const [node, parts] of byNode) {
    if (!parts.some(p => p[1])) continue;
    const frag = document.createDocumentFragment(); let el = null;
    for (const [t, ch] of parts) {
      if (ch) { if (!el) { el = document.createElement(tag); frag.appendChild(el); } el.appendChild(document.createTextNode(t)); }
      else if (el && /^\s+$/.test(t)) el.appendChild(document.createTextNode(t));
      else { el = null; frag.appendChild(document.createTextNode(t)); }
    }
    node.replaceWith(frag);
  }
}
function markWhole(block, tag) { const t = textTokens(block); wrapTokens(t, t.map(() => true), tag); }
function markSideBySide(a, b) {
  const ba = [...a.children], bb = [...b.children];
  const key = el => el.textContent.replace(/\s+/g, " ").trim();
  const ops = lcs(ba.map(key), bb.map(key));
  if (!ops) return;
  let i = 0, j = 0;
  for (let k = 0; k < ops.length; k++) {
    const [o] = ops[k];
    if (o === "=") { i++; j++; continue; }
    if (o === "-" && ops[k + 1] && ops[k + 1][0] === "+") {
      const ta = textTokens(ba[i]), tb = textTokens(bb[j]);
      const d = lcs(ta.map(x => x.t), tb.map(x => x.t));
      if (!d) { markWhole(ba[i], "del"); markWhole(bb[j], "ins"); }
      else {
        const ca = [], cb = [];
        for (const [op] of d) { if (op === "=") { ca.push(false); cb.push(false); } else if (op === "-") ca.push(true); else cb.push(true); }
        wrapTokens(ta, ca, "del"); wrapTokens(tb, cb, "ins");
      }
      i++; j++; k++;
    } else if (o === "-") markWhole(ba[i++], "del");
    else markWhole(bb[j++], "ins");
  }
}

// ---------- rendering ----------
function resolve(base, href) {
  const parts = base.split("/").slice(0, -1);
  for (const seg of decodeURI(href).split("/")) { if (seg === "..") parts.pop(); else if (seg !== ".") parts.push(seg); }
  return parts.join("/");
}
function renderMd(md, base) {
  const html = marked.parse(md, { gfm: true });
  const div = document.createElement("div"); div.innerHTML = html;
  div.querySelectorAll("a[href]").forEach(a => {
    const h = a.getAttribute("href");
    if (/^https?:/.test(h)) { a.target = "_blank"; a.rel = "noopener"; return; }
    if (/\.md(#.*)?$/.test(h)) a.setAttribute("href", "#/" + encodeURI(resolve(base, h.replace(/#.*$/, ""))));
  });
  // listes de tâches (ORDRE DE TRAVAIL) : case = fait, bouton ⊘ = pas pris en compte
  const taskLists = new Set();
  div.querySelectorAll("li").forEach(li => {
    const cb = li.querySelector(":scope > input[type=checkbox]");
    if (!cb) return;
    const a = li.querySelector("a[href^='#/']");
    const key = a ? decodeURI(a.getAttribute("href").slice(2)) : null;
    li.classList.add("task"); cb.disabled = false;
    if (!key) return;
    li.dataset.key = key; taskLists.add(li.parentElement);
    const ig = document.createElement("button"); ig.className = "ign"; ig.type = "button";
    const paint = () => {
      const e = etatOf(key); cb.checked = e === "fait";
      li.classList.toggle("done", e === "fait"); li.classList.toggle("ignored", e === "ignore");
      ig.textContent = e === "ignore" ? "⊘ pas pris en compte" + (done[key].raison ? " : " + done[key].raison : "") : "⊘";
      ig.title = e === "ignore" ? "Remettre à traiter" : "Marquer « pas pris en compte »";
    };
    paint();
    cb.addEventListener("change", () => { setEtats([[key, cb.checked ? "fait" : null]]); paint(); });
    ig.addEventListener("click", () => {
      if (etatOf(key) === "ignore") setEtats([[key, null]]);
      else { const r = prompt("Pourquoi n'est-ce pas pris en compte ? (facultatif)\nEx. : on n'utilise pas le système de statut VO", ""); if (r === null) return; setEtats([[key, "ignore", r.trim()]]); }
      paint();
    });
    li.appendChild(ig);
  });
  // action groupée : un bouton par liste
  for (const ul of taskLists) {
    const keys = [...ul.querySelectorAll(":scope > li[data-key]")].map(li => li.dataset.key);
    if (keys.length < 2) continue;
    const bar = document.createElement("div"); bar.className = "bulk";
    const b1 = document.createElement("button"); b1.type = "button"; b1.textContent = `⊘ Toute cette liste : pas prise en compte (${keys.length})`;
    b1.onclick = () => { const r = prompt(`Marquer ces ${keys.length} fiches « pas prises en compte ».\nMotif (facultatif) :`, ""); if (r === null) return; setEtats(keys.map(k => [k, "ignore", r.trim()])).then(() => show(decodeURI(location.hash.slice(2)) || "ORDRE DE TRAVAIL.md")); };
    const b2 = document.createElement("button"); b2.type = "button"; b2.textContent = "Remettre toute la liste à traiter";
    b2.onclick = () => { if (!confirm(`Remettre ces ${keys.length} fiches à « à traiter » (fait et pas pris en compte effacés) ?`)) return; setEtats(keys.map(k => [k, null])).then(() => show(decodeURI(location.hash.slice(2)) || "ORDRE DE TRAVAIL.md")); };

}
function extract(md, title) {

}
let mode = store.get("fcf-mode", "diff");
function show(p) {

  const translation = vo !== null && proposed !== null;
  const oldT = translation ? vo : extract(f.md, "Ancienne version"), newT = translation ? proposed : extract(f.md, "Version corrigée");
  const oldLabel = translation ? "Version originale (VO)" : "Ancienne version (wiki)";
  const newLabel = translation ? "Traduction proposée — non votée" : "Version corrigée";
  doc.innerHTML = "";
  if (oldT === null || newT === null) { doc.appendChild(renderMd(f.md, f.path)); finish(f); return; }
  const head = f.md.split(translation ? /\n## Version originale/ : /\n## Ancienne version/)[0];
  const top = renderMd(head, f.path);
  const h1 = top.querySelector("h1");
  if (h1 && f.statut) h1.insertAdjacentHTML("afterend", `<p><span class="badge" style="background:${COLORS[f.statut] || "#888"}">${esc(f.statut)}</span> ${f.gravite ? "· " + esc(f.gravite) : ""}
    </p><div class="etat" role="radiogroup" aria-label="Avancement">
      <label><input type="radio" name="etat" value=""> À traiter</label>
      <label><input type="radio" name="etat" value="fait"> ✓ Fait sur le wiki</label>
      <label><input type="radio" name="etat" value="ignore"> ⊘ Pas pris en compte</label>
      <input type="text" id="raison" placeholder="Motif (ex. : on n'utilise pas le système de statut VO)" aria-label="Motif">
    </div>`);
  doc.appendChild(top);
  const cur = done[f.path] || {}, raison = doc.querySelector("#raison");
  if (raison) {
    doc.querySelectorAll("input[name=etat]").forEach(r => { r.checked = (r.value || null) === (cur.etat || null); r.addEventListener("change", () => { raison.hidden = r.value !== "ignore"; setEtats([[f.path, r.value || null, r.value === "ignore" ? raison.value.trim() : ""]]); }); });
    raison.value = cur.raison || ""; raison.hidden = cur.etat !== "ignore";
    raison.addEventListener("change", () => { if (etatOf(f.path) === "ignore") setEtats([[f.path, "ignore", raison.value.trim()]]); });
  }
  const d = translation ? null : diffHtml(oldT, newT);
  const activeMode = translation && mode === "diff" ? "cote" : mode;
  const tabs = document.createElement("div"); tabs.className = "tabs";
  const views = translation ? { cote: "VO / traduction", brut: "Textes à copier" } : { diff: `Différences (${d.changed} paragraphe${d.changed > 1 ? "s" : ""})`, cote: "Côte à côte", brut: "Texte à copier" };
  const zone = document.createElement("div");
  for (const [k, label] of Object.entries(views)) {
    const b = document.createElement("button"); b.textContent = label; if (k === activeMode) b.className = "on";
    b.onclick = () => { mode = k; store.set("fcf-mode", k); show(p); }; tabs.appendChild(b);
  }
  doc.append(tabs, zone);
  if (activeMode === "diff") zone.innerHTML = `<div class="diff">${d.html}</div><p style="color:var(--muted);font-size:13px">Liens et gras retirés pour lisibilité. <del>barré</del> = supprimé, <ins>souligné vert</ins> = ajouté.</p>`;
  else if (activeMode === "brut") {
    zone.innerHTML = `<div class="cols"><div class="col"><h3>${oldLabel}</h3><pre>${esc(oldT)}</pre></div><div class="col new"><button class="copy">Copier</button><h3>${newLabel}</h3><pre>${esc(newT)}</pre></div></div>`;
    zone.querySelector(".copy").onclick = e => { navigator.clipboard.writeText(newT).then(() => e.target.textContent = "Copié ✓"); };
  } else {
    const cols = document.createElement("div"); cols.className = "cols";
    const r1 = renderMd(oldT, f.path), r2 = renderMd(newT, f.path);
    if (!translation) markSideBySide(r1, r2);
    const c1 = document.createElement("div"); c1.className = "col"; c1.innerHTML = `<h3>${oldLabel}</h3>`; c1.appendChild(r1);
    const c2 = document.createElement("div"); c2.className = "col new"; c2.innerHTML = `<h3>${newLabel}</h3>`; c2.appendChild(r2);
    cols.append(c1, c2); zone.appendChild(cols);
  }
  const ecn = extract(f.md, "Traduction ECN examinée");
  if (ecn !== null) {
    const details = document.createElement("details");
    details.innerHTML = "<summary>Voir la traduction ECN examinée — non votée</summary>";

}
function finish(f) { document.title = f.titre + " – Corrections FCF"; markActive(); document.querySelector("main").scrollTop = 0; }
function markActive() {
  const p = decodeURI(location.hash.slice(2));
  document.querySelectorAll("#tree a").forEach(a => {
    const on = a.dataset.p === p; a.classList.toggle("active", on);

// ---------- démarrage ----------
async function start(fiches, cfg) {
  F = fiches; CFG = cfg || {}; byPath = Object.fromEntries(F.map(f => [f.path, f]));
  for (const f of F) hashes[f.path] = await sha(f.path);
  [...new Set(F.map(f => f.statut).filter(Boolean))].forEach(s => sel.insertAdjacentHTML("beforeend", `<option>${s}</option>`));
  document.getElementById("q").addEventListener("input", buildTree);
  sel.addEventListener("change", buildTree);
  window.addEventListener("hashchange", () => show(decodeURI(location.hash.slice(2))));
  if (!remote()) setState(window.FICHES ? "Version locale : cases gardées dans ce navigateur" : "Sans jeton GitHub : cases gardées dans ce navigateur seulement", !window.FICHES);
  await refresh();
  if (remote()) { window.addEventListener("focus", () => refresh().then(() => { buildTree(); show(decodeURI(location.hash.slice(2)) || "ORDRE DE TRAVAIL.md"); })); }
  document.getElementById("login").remove();
  buildTree();
  show(location.hash.length > 2 ? decodeURI(location.hash.slice(2)) : "ORDRE DE TRAVAIL.md");
}
async function unlock(pw) {
  const enc = await (await fetch("donnees.enc", { cache: "no-store" })).json();
  const u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: u(enc.salt), iterations: enc.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: u(enc.iv) }, key, u(enc.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
if (window.FICHES) start(window.FICHES, {});
else {
  const form = document.getElementById("loginform"), msg = document.getElementById("loginmsg");
  const go = async pw => {
    msg.textContent = "Ouverture…";
    try { const d = await unlock(pw); try { sessionStorage.setItem("fcf-mdp", pw); } catch {} await start(d.fiches, { token: d.token, repo: d.repo }); }
    catch (e) { msg.textContent = "Mot de passe incorrect."; try { sessionStorage.removeItem("fcf-mdp"); } catch {} }
  };
  form.addEventListener("submit", e => { e.preventDefault(); go(document.getElementById("pw").value); });
  let saved = null; try { saved = sessionStorage.getItem("fcf-mdp"); } catch {}
  if (saved) go(saved); else document.getElementById("pw").focus();
}
